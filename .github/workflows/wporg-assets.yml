name: Update WordPress.org readme and assets

# Pushes readme.txt and .wordpress-org/ (banners, icons, screenshots) to WordPress.org
# without a new release, e.g. after bumping "Tested up to".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - readme.txt
      - .wordpress-org/**

permissions:
  contents: read

jobs:
  assets:
    # Off until the plugin is approved on WordPress.org: set repository variable WPORG_ENABLED=true.
    if: vars.WPORG_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: casapay-for-woocommerce
          IGNORE_OTHER_FILES: true
